# Bouwt WarmtepompenMatch en publiceert via GitHub Pages.
# LIVE sinds 17-10-2026 (akkoord Dave): BASE leeg, GO_LIVE=1 (CNAME warmtepompenmatch.nl, indexeerbaar). Testversie was BASE=/warmtepompenmatch-site.
name: Deploy WarmtepompenMatch
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
env:
  BASE: ''
  GO_LIVE: '1'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # L7: basis = github.event.before moet in de clone zitten
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
        env:
          L7_BASE: ${{ github.event.before }} # L7 vergelijkt met wat live stond, niet HEAD met zichzelf
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
